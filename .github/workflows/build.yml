name: Build Exploration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Linux build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Configure
        run: cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-host --parallel 2

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: exploration-linux
          path: build-host/exploration
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: x86
            api: 21
          - abi: x86_64
            api: 21
          - abi: armeabi-v7a
            api: 21
          - abi: arm64-v8a
            api: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B "build-android-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.api }}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "build-android-${{ matrix.abi }}" --parallel 2

      - name: Upload Android native library
        uses: actions/upload-artifact@v4
        with:
          name: exploration-${{ matrix.abi }}
          path: build-android-${{ matrix.abi }}/libexploration_app.so
          if-no-files-found: error

  package-apk:
    name: Package universal APK
    runs-on: ubuntu-latest
    needs: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install APK packaging tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Download x86 library
        uses: actions/download-artifact@v4
        with:
          name: exploration-x86
          path: apk-libs/x86

      - name: Download x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: exploration-x86_64
          path: apk-libs/x86_64

      - name: Download ARMv7 library
        uses: actions/download-artifact@v4
        with:
          name: exploration-armeabi-v7a
          path: apk-libs/armeabi-v7a

      - name: Download ARM64 library
        uses: actions/download-artifact@v4
        with:
          name: exploration-arm64-v8a
          path: apk-libs/arm64-v8a

      - name: Build and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          mkdir -p dist

          # Native libraries are compiled against API 21; advertise that minimum in the APK.
          sed 's/android:minSdkVersion="16"/android:minSdkVersion="21"/' \
            android/AndroidManifest.xml > dist/AndroidManifest.xml

          "$BT/aapt" package -f \
            -M dist/AndroidManifest.xml \
            -A android/assets \
            -I "$PLATFORM" \
            -F dist/exploration-unsigned.apk

          python3 - <<'PY'
          import pathlib
          import zipfile

          apk = pathlib.Path("dist/exploration-unsigned.apk")
          abis = ("x86", "x86_64", "armeabi-v7a", "arm64-v8a")
          with zipfile.ZipFile(apk, "a") as z:
              for abi in abis:
                  lib = pathlib.Path("apk-libs") / abi / "libexploration_app.so"
                  if not lib.is_file():
                      raise SystemExit(f"Missing native library: {lib}")
                  z.write(lib, f"lib/{abi}/libexploration_app.so", compress_type=zipfile.ZIP_STORED)
          PY

          "$BT/zipalign" -f 4 dist/exploration-unsigned.apk dist/exploration-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore dist/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Exploration Reconstruction Debug" \
            -keyalg RSA -keysize 2048 -validity 10000

          "$BT/apksigner" sign \
            --ks dist/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out dist/exploration-debug.apk \
            dist/exploration-aligned.apk

          "$BT/apksigner" verify --verbose dist/exploration-debug.apk
          "$BT/zipalign" -c 4 dist/exploration-debug.apk
          ls -lh dist/exploration-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: exploration-debug-apk
          path: dist/exploration-debug.apk
          if-no-files-found: error
