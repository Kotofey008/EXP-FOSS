name: Build Exploration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Linux build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            gcc

      - name: Configure
        run: |
          cmake -S . -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-host --parallel 2

      - name: Test
        run: |
          ctest \
            --test-dir build-host \
            --output-on-failure

      - name: Upload host executable
        uses: actions/upload-artifact@v4
        with:
          name: exploration-linux
          path: build-host/exploration
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: x86
            api: 16

          - abi: x86_64
            api: 21

          - abi: armeabi-v7a
            api: 16

          - abi: arm64-v8a
            api: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B "build-android-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.api }}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build "build-android-${{ matrix.abi }}" \
            --parallel 2

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: exploration-${{ matrix.abi }}
          path: build-android-${{ matrix.abi }}/libexploration_app.so
          if-no-files-found: error